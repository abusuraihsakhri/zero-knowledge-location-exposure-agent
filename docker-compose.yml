services:
  location-exposure-agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set a cryptographically random AUDIT_SECRET_KEY (at least 32 characters)}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Set a random API_ACCESS_TOKEN}
    restart: unless-stopped
